[project]
name = "diputado-detector"
version = "0.1.0"
description = "DiputadoDetector: detector de estafas multimodal que funciona 100 % en local"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Equipo DiputadoDetector" }]
dependencies = [
    # Núcleo de deep learning (CUDA en Windows/Linux, CPU/MPS en macOS)
    "torch>=2.6",
    "keras>=3.8",
    # Ecosistema Hugging Face
    "transformers>=4.51,<5",
    "diffusers>=0.32",
    "accelerate>=1.3",
    "safetensors>=0.5",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "huggingface-hub[hf-xet]>=0.30",
    "datasets>=3.3",
    # pyarrow 25 trae DLL que Smart App Control (Windows 11) aún bloquea; 24 está verificada
    "pyarrow>=21,<25",
    # Lo mismo con rpds-py 2026.x (dependencia de jsonschema/nbformat); 0.27 está verificada
    "rpds-py>=0.20,<0.28",
    # LLM locales y agentes
    "ollama>=0.4.7",
    "smolagents[litellm]>=1.13",
    # Interfaz
    "gradio>=5.20,<6",
    "plotly>=5.24",
    # Audio, imagen y vídeo
    "soundfile>=0.13",
    "scipy>=1.14",
    "pillow>=11",
    "moviepy>=2.1",
    "imageio-ffmpeg>=0.6",
    # Datos y evaluación
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "matplotlib>=3.9",
    "pydantic>=2.10",
    "rapidfuzz>=3.12",
    "jiwer>=3.1",
    # Notebooks y tests
    "jupyterlab>=4.3",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "pytest>=8.3",
    "psutil>=6.1",
    "tqdm>=4.67",
    "piper-tts>=1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diputado"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
